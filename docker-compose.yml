x-backend: &backend
  image: api-migration-proxy-local
  build:
    context: .
    target: local
  init: true
  command: ["python", "-m", "uvicorn", "examples.backend:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--no-proxy-headers"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
    interval: 2s
    timeout: 3s
    retries: 15

services:
  v1:
    <<: *backend
    environment:
      BACKEND_VERSION: v1
  v2:
    <<: *backend
    environment:
      BACKEND_VERSION: v2
  proxy:
    image: api-migration-proxy-local
    build:
      context: .
      target: local
    init: true
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:8080"
    volumes:
      - events:/data
      - ./examples/docker.json:/app/examples/docker.json:ro
    depends_on:
      v1:
        condition: service_healthy
      v2:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15
  test:
    profiles: [test]
    build:
      context: .
      target: test
    init: true

volumes:
  events:
