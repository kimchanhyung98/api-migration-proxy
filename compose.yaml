services:
  proxy:
    build:
      context: .
      target: runtime
    command: ["serve"]
    environment:
      API_PROXY_CONFIG: /config/proxy.json
      API_PROXY_HOST: 0.0.0.0
      API_PROXY_PORT: "8080"
      API_PROXY_EVENT_STORE_BACKEND: sqlite
      API_PROXY_EVENT_STORE: /data/events.sqlite
      API_PROXY_RETENTION_INTERVAL_SECONDS: "60"
      API_PROXY_RETENTION_BATCH_SIZE: "1000"
      API_PROXY_CONTROL_ENABLED: "true"
      API_PROXY_CONTROL_HOST: 127.0.0.1
      API_PROXY_CONTROL_PORT: "9090"
      API_PROXY_CONTROL_TOKEN: ""
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./deploy/proxy.json
        target: /config/proxy.json
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: event-data
        target: /data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/healthcheck', timeout=2).close()"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  event-data:
